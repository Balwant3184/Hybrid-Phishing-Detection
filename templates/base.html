<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhishGuard - Hybrid Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ChartJS (Required for all charts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Gauge Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-gauge"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold text-primary">🛡 PhishScan</a>
    <div class="ms-auto">
        <a href="/" class="btn btn-sm btn-outline-primary me-2">Home</a>
        <a href="/scanner" class="btn btn-sm btn-primary">Scanner</a>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main JS (Always Last) -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
